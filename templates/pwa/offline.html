{% load i18n %}<!doctype html>
<html lang="{{ language }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2e9db"><meta name="robots" content="noindex,nofollow"><title>{% translate 'Sin conexión · Canela' %}</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:#fbf7f0;color:#493428;font:16px/1.7 system-ui,sans-serif;padding:28px}main{max-width:490px;width:100%}.brand{display:flex;align-items:center;gap:9px;font-size:30px;font-weight:750;letter-spacing:-1.5px;margin-bottom:65px}.brand svg{width:34px;height:34px}h1{font:400 clamp(32px,8vw,45px)/1.15 Georgia,serif;margin:0 0 22px}p{color:#706052;margin:0 0 30px}button{font:inherit;background:#87502e;color:#fffaf3;border:0;border-radius:8px;padding:12px 22px;min-height:48px;cursor:pointer}button:focus-visible{outline:3px solid #a5683e;outline-offset:4px}@media(max-width:480px){.brand{margin-bottom:45px}}.brand{gap:7px}.brand .brand-mark{width:40px;height:40px;flex-shrink:0}.brand .brand-name{font:700 35px/1.1 Georgia,serif;letter-spacing:-1.8px}.brand .brand-dot{color:#a5683e;margin-left:1px}</style></head>
<body><main><div class="brand"><svg class="brand-mark" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <g stroke="#a5683e" stroke-linecap="round" stroke-linejoin="round">
    <path d="M49 18 C40 7 22 9 14 21 C5 34 12 51 27 54 C38 57 49 50 53 40" stroke-width="7"/>
    <path d="M40 25 C34 19 25 22 22 29 C19 36 24 44 31 44 C38 44 43 38 42 33 C41 29 37 28 34 30" stroke-width="3.5"/>
  </g>
</svg><span class="brand-name">canela<span class="brand-dot">.</span></span></div><h1>{% translate 'El taller necesita conexión.' %}</h1><p>{% translate 'No podemos conectar con Canela. Comprueba tu conexión o vuelve a intentarlo más tarde.' %}</p><button type="button" onclick="window.location.reload()">{% translate 'Volver a intentar' %}</button></main></body></html>
