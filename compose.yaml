services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: canela
      POSTGRES_USER: canela
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canela -d canela"]
      interval: 5s
      timeout: 3s
      retries: 15
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_ENGINE: postgresql
      POSTGRES_HOST: db
      POSTGRES_DB: canela
      POSTGRES_USER: canela
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      SECRET_KEY: ${SECRET_KEY:?Configura SECRET_KEY en .env}
      DEBUG: ${DEBUG:-1}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ALLOW_NEW_ACCOUNTS: ${ALLOW_NEW_ACCOUNTS:-0}
    volumes:
      - photos:/app/media
      - runtime:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  database:
  photos:
  runtime:
